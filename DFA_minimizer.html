<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFA Minimizer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: two stacked desktop-style windows (editor on top, results below), classic grey chrome like the JFLAP screenshots. */
:root{
  --ui:Tahoma,"Segoe UI",Verdana,Arial,sans-serif;
  --mono:Consolas,"Lucida Console","Courier New",monospace;
  --bg:#c9d2c3; --win:#efefe9; --bar:#dedfd7; --btn:#e8e8e1; --line:#9ea496; --canvas:#ffffff;
  --title:#48637e; --title-ink:#ffffff;
  --ink:#1f2320; --ink2:#575c53; --accent:#2f6aa8; --accent-ink:#ffffff; --accent-soft:#d6e3f1;
  --state:#9fd3e6; --state-edge:#33758c; --state-ink:#12303b; --init:#f0e060; --init-edge:#8a7d10; --edge:#2b2f2c;
  --bad:#b3261e; --bad-soft:#f5dbd7; --good:#2e7d32; --good-soft:#d9ecda; --info:#2f6aa8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e231d; --win:#2a2f29; --bar:#343a33; --btn:#394038; --line:#566053; --canvas:#1b1f1a;
  --title:#34506a; --title-ink:#eef3f7;
  --ink:#e6e9e2; --ink2:#a3aa9d; --accent:#7fb2e5; --accent-ink:#0d1b2a; --accent-soft:#2b4157;
  --state:#2c6277; --state-edge:#8fd0e6; --state-ink:#e4f6fb; --init:#6b6317; --init-edge:#ecdc62; --edge:#bfc9c2;
  --bad:#f08b78; --bad-soft:#412620; --good:#86d6a0; --good-soft:#1c3624; --info:#7fb2e5;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e231d; --win:#2a2f29; --bar:#343a33; --btn:#394038; --line:#566053; --canvas:#1b1f1a;
  --title:#34506a; --title-ink:#eef3f7;
  --ink:#e6e9e2; --ink2:#a3aa9d; --accent:#7fb2e5; --accent-ink:#0d1b2a; --accent-soft:#2b4157;
  --state:#2c6277; --state-edge:#8fd0e6; --state-ink:#e4f6fb; --init:#6b6317; --init-edge:#ecdc62; --edge:#bfc9c2;
  --bad:#f08b78; --bad-soft:#412620; --good:#86d6a0; --good-soft:#1c3624; --info:#7fb2e5;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.4;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.shell{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.win{background:var(--win);border:1px solid var(--line);min-width:0;box-shadow:3px 3px 0 rgba(0,0,0,.18)}
.titlebar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--title);color:var(--title-ink);font-size:13px}
.titlebar svg{flex:none}
.titlebar .sub{opacity:.8}

/* menu bar */
.menubar{display:flex;flex-wrap:wrap;padding:2px 4px;border-bottom:1px solid var(--line);background:var(--bar)}
.menuwrap{position:relative}
.menubtn{background:none;border:1px solid transparent;padding:3px 9px;font-size:13px}
.menubtn:hover,.menubtn[aria-expanded="true"]{background:var(--win);border-color:var(--line)}
.menu{position:absolute;top:100%;left:0;min-width:280px;max-width:calc(100vw - 32px);background:var(--win);border:1px solid var(--line);box-shadow:3px 3px 0 rgba(0,0,0,.25);padding:2px;z-index:30}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 10px;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--accent);color:var(--accent-ink);outline:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:3px 2px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:5px 8px;background:var(--bar);border-bottom:1px solid var(--line)}
.tool{width:34px;height:30px;display:grid;place-items:center;background:var(--btn);border:1px solid var(--line);border-radius:2px}
.tool svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{border-color:var(--accent)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 1px 1px 3px rgba(0,0,0,.3)}
.tool:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 5px}
.tb-right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--btn);border:1px solid var(--line);border-radius:2px;padding:4px 12px;font-size:13px}
.btn:hover{border-color:var(--accent);background:var(--win)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}

.inspector{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-height:38px;padding:5px 10px;border-bottom:1px solid var(--line);color:var(--ink2)}
.inspector strong{color:var(--ink)}
.inspector label{display:flex;gap:5px;align-items:center}
.inspector input[type=text]{width:9ch;padding:2px 5px;background:var(--canvas);border:1px solid var(--line);font-family:var(--mono)}
.inspector input.syms{width:11ch}
.pill{border:1px solid var(--line);background:var(--btn);border-radius:2px;padding:2px 10px;font-size:12px;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.danger{color:var(--bad)}
.pill.danger:hover{background:var(--bad-soft)}

.canvaswrap{position:relative;background:var(--canvas)}
.canvas{display:block;width:100%;height:clamp(300px,46vh,430px);touch-action:none;user-select:none;-webkit-user-select:none;background:var(--canvas)}
.canvas[data-tool="state"],.canvas[data-tool="trans"]{cursor:crosshair}
.canvas[data-tool="del"]{cursor:not-allowed}
.canvas.mini{height:clamp(260px,38vh,360px)}

.st{cursor:grab}
.st .body{fill:var(--state);stroke:var(--state-edge);stroke-width:1.5}
.st.init .body{fill:var(--init);stroke:var(--init-edge)}
.st .ring{fill:none;stroke:var(--state-edge);stroke-width:1.5}
.st.init .ring{stroke:var(--init-edge)}
.st .tri{fill:var(--canvas);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.st text{font:13px var(--ui);fill:var(--state-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.st text.sub{font:11px var(--mono);fill:var(--ink2)}
.st.sel .body{stroke:var(--accent);stroke-width:3.5}
.edge .ln{fill:none;stroke:var(--edge);stroke-width:1.4}
.edge .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.edge .lb{font:13px var(--ui);fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.edge.sel .ln{stroke:var(--accent);stroke-width:2.4}
.mk path{fill:var(--edge)}
.mk-sel path{fill:var(--accent)}
.rubber{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4;fill:none}

.lbl{position:absolute;z-index:5;display:flex;gap:5px;align-items:center;background:var(--win);border:1px solid var(--accent);padding:4px;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.lbl input{width:9ch;padding:3px 5px;border:1px solid var(--line);background:var(--canvas);font-family:var(--mono)}
.lbl .btn{padding:3px 10px}

.sizebar{display:flex;align-items:center;gap:10px;padding:4px 10px;border-top:1px solid var(--line);background:var(--bar);font-size:12px}
.sizebar input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
.sizebar output{font-family:var(--mono);min-width:4ch;text-align:right;color:var(--ink2)}
.statusbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;padding:4px 10px;border-top:1px solid var(--line);background:var(--win);font-size:12px;color:var(--ink2)}
.statusbar .msg.err{color:var(--bad);font-weight:700}
.statusbar .msg.ok{color:var(--good);font-weight:700}
.statusbar .count{font-family:var(--mono);font-size:12px}

/* results */
.res{padding:12px;display:grid;gap:12px;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.stat{display:flex;flex-direction:column}
.stat b{font:700 22px/1.15 var(--ui);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.arrowsep{align-self:center;color:var(--ink2);font-size:18px}
.classes{display:flex;flex-wrap:wrap;gap:5px;align-items:center;color:var(--ink2)}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 6px;border:1px solid var(--line);background:var(--canvas);color:var(--ink)}
.chip.dim{color:var(--ink2);text-decoration:line-through;background:transparent;border-style:dashed}
.chip.cls{background:var(--accent-soft);border-color:var(--accent)}
.verify{color:var(--good)}
.verify.bad{color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:1px;border-bottom:1px solid var(--line)}
.tab{background:var(--bar);border:1px solid var(--line);border-bottom:0;padding:5px 12px;color:var(--ink2);margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--canvas);color:var(--ink);font-weight:700;padding-bottom:6px}
.panel{background:var(--canvas);border:1px solid var(--line);border-top:0;padding:14px;display:grid;gap:12px;min-width:0}
.panel h3{margin:0;font-size:13px;font-weight:700}
.panel p{margin:0;max-width:72ch}
.muted{color:var(--ink2)}
.scroll{overflow-x:auto;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
table.dt{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.dt th,.dt td{border:1px solid var(--line);padding:3px 10px;text-align:center}
.dt thead th{background:var(--bar)}
.dt tbody th{background:var(--bar);text-align:left;font-weight:400}
.dt tr.dim td,.dt tr.dim th{color:var(--ink2);text-decoration:line-through;background:transparent}
.dt .grp td,.dt .grp th{border-top:2px solid var(--ink2)}
.panel code{font-family:var(--mono);background:var(--accent-soft);padding:0 4px}
.round{display:grid;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.round:first-of-type{border-top:0;padding-top:0}
.round .head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.round .head b{font-size:13px}
.blocks{display:flex;flex-wrap:wrap;gap:6px}
.block{display:flex;gap:5px;align-items:center;padding:2px 7px;border:1px solid var(--accent);background:var(--accent-soft);font-family:var(--mono);font-size:12.5px}
.block i{font-style:normal;font-weight:700;color:var(--ink2)}
.mincols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.mincols .gwin{border:1px solid var(--line);overflow:hidden}
.mincols .side{display:grid;gap:10px;min-width:0}
.empty{padding:18px;background:var(--canvas);border:1px dashed var(--line);color:var(--ink2)}
.empty strong{color:var(--ink);display:block;margin-bottom:3px}
@media (max-width:820px){.mincols{grid-template-columns:minmax(0,1fr)}}

/* dialogs */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.35)}
.dlg{width:min(460px,100%);background:var(--win);border:1px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.3);max-height:calc(100dvh - 32px);display:flex;flex-direction:column}
.dlg.wide{width:min(640px,100%)}
.dlg-title{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 4px 10px;border-bottom:1px solid var(--line);background:var(--bar)}
.dlg-title .x{background:none;border:0;width:26px;height:22px;font-size:17px;line-height:1;color:var(--ink2)}
.dlg-title .x:hover{background:var(--bad-soft);color:var(--bad)}
.dlg-body{padding:14px;overflow:auto;display:grid;gap:10px}
.dlg-btns{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:2px 14px 14px}
.dlg-btns .btn{min-width:80px}
.msgrow{display:flex;gap:12px;align-items:center}
.msgicon{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--ui);color:#fff;background:var(--info)}
.msgicon.q{background:var(--good);border-radius:3px}
.msgtext{font-weight:700;font-size:14px}
.msgtext.bad{color:var(--bad)}
.msgtext.good{color:var(--good)}
.field{display:grid;gap:5px}
.field label{font-weight:700}
.field input,.field textarea{width:100%;padding:5px 7px;background:var(--canvas);border:1px solid var(--line);font-family:var(--mono);font-size:13px}
.field textarea{min-height:190px;resize:vertical;font-size:12px}
.ctx{margin:0;color:var(--ink2);font-size:12px}
.cfglist{list-style:none;margin:0;padding:6px;max-height:min(46vh,330px);overflow:auto;background:var(--canvas);border:1px solid var(--line);display:grid;gap:0}
.cfg{display:flex;align-items:center;gap:8px}
.cfg .chipst{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:12px var(--ui);background:var(--state);border:2px solid var(--state-edge);color:var(--state-ink);margin-left:20px}
.cfg .chipst.init{background:var(--init);border-color:var(--init-edge)}
.cfg .chipst.fin::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px solid currentColor;opacity:.6}
.cfg .chipst.init::before{content:"";position:absolute;left:-19px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:14px solid var(--ink);border-right:0}
.cfgbox{flex:1;min-width:0;padding:3px 8px;border:2px solid var(--state-edge);background:var(--win);font-family:var(--mono);font-size:13px;letter-spacing:.05em;overflow-wrap:anywhere}
.cfgbox .done{color:var(--ink2)}
.cfgbox .cur{background:var(--accent-soft);border-bottom:2px solid var(--accent)}
.cfgarrow{display:flex;justify-content:center;gap:6px;color:var(--ink2);font:12px var(--mono);padding:1px 0}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:6px 12px;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.flash{animation:flash .9s ease-out}@keyframes flash{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:3px 3px 0 rgba(0,0,0,.18)}}}
</style>

<div class="shell">
  <section class="win" id="editorWin" aria-label="Automaton editor">
    <div class="titlebar">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="5.5" cy="10" r="3.6" fill="var(--init)" stroke="var(--init-edge)" stroke-width="1.5"/><circle cx="14.5" cy="10" r="3.6" fill="var(--state)" stroke="var(--state-edge)" stroke-width="1.5"/><path d="M9.3 10h1.4" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>DFA Minimizer <span class="sub">: &lt;untitled1&gt;</span></span>
    </div>
    <div class="menubar" id="menubar" role="menubar" aria-label="Menu"></div>
    <div class="toolbar" role="toolbar" aria-label="Editor tools">
      <button class="tool" data-tool="select" title="Attribute editor: select, move and edit" aria-label="Select tool"><svg viewBox="0 0 24 24"><path d="M6 3l12 9-5.2 1.2L16 20l-2.6 1-3.2-6.7L6 18z"/></svg></button>
      <button class="tool" data-tool="state" title="State creator: click the canvas to add a state" aria-label="State tool"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="tool" data-tool="trans" title="Transition creator: drag from state to state" aria-label="Transition tool"><svg viewBox="0 0 24 24"><path d="M3 12h15M13 6l6 6-6 6"/></svg></button>
      <button class="tool" data-tool="del" title="Deleter: click a state or arrow" aria-label="Delete tool"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg></button>
      <span class="sep"></span>
      <button class="tool" id="btnUndo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 8L4 13l5 5M4 13h10a6 6 0 010 0 6 6 0 016 6"/></svg></button>
      <button class="tool" id="btnRedo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 8l5 5-5 5M20 13H10a6 6 0 00-6 6"/></svg></button>
      <div class="tb-right">
        <button class="btn" id="btnRun">Run input…</button>
        <button class="btn primary" id="btnMin">Minimize DFA</button>
      </div>
    </div>
    <div class="inspector" id="inspector" aria-live="polite"></div>
    <div class="canvaswrap" id="edWrap">
      <svg class="canvas" id="edSvg" data-tool="select" role="img" aria-label="DFA drawing area"></svg>
      <form class="lbl" id="lbl" hidden>
        <input id="lblIn" type="text" autocomplete="off" spellcheck="false" aria-label="Transition symbols" placeholder="0,1">
        <button class="btn primary" type="submit">OK</button>
      </form>
    </div>
    <div class="sizebar"><label for="edSize">Automaton Size</label><input type="range" id="edSize" min="30" max="200" value="100"><output id="edSizeOut" for="edSize">100%</output></div>
    <div class="statusbar"><span class="msg" id="status" role="status"></span><span class="count" id="count"></span></div>
  </section>

  <section class="win" id="results" aria-label="Minimization results">
    <div class="titlebar">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 9h8M3 14h5M9 3v14M14 3v8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      <span>Minimization <span class="sub">: unreachable states, partition refinement</span></span>
    </div>
    <div class="res" id="resBody"></div>
  </section>
</div>

<script>
/* ---------- DFA core: validation, reachability, Moore partition refinement ---------- */
const DEAD = '∅';

function sortSyms(a) { return [...a].sort(); }

function runModelOf(dfa) {
  const delta = {};
  dfa.states.forEach(s => { delta[s.id] = {}; });
  dfa.trans.forEach(t => t.syms.forEach(a => { if (delta[t.from]) delta[t.from][a] = t.to; }));
  const init = dfa.states.find(s => s.initial);
  return {
    init: init ? init.id : null,
    finals: new Set(dfa.states.filter(s => s.final).map(s => s.id)),
    delta
  };
}

function validate(dfa) {
  const errors = [];
  if (!dfa.states.length) errors.push('Add at least one state to the canvas.');
  else if (!dfa.states.some(s => s.initial)) errors.push('Mark one state as the initial state.');
  const seen = {};
  for (const t of dfa.trans) {
    for (const a of t.syms) {
      const k = t.from + '\u0000' + a;
      if (seen[k] !== undefined && seen[k] !== t.to) errors.push(t.from + ' has two different moves on ' + a + '.');
      seen[k] = t.to;
    }
  }
  return errors;
}

function walkStr(delta, s, str) {
  let cur = s;
  for (const ch of Array.from(str)) {
    if (cur === undefined) return undefined;
    cur = delta[cur] ? delta[cur][ch] : undefined;
  }
  return cur;
}

function runInput(model, str) {
  let s = model.init;
  const trace = [{ state: s, pos: 0, sym: null }];
  const chars = Array.from(str);
  for (let k = 0; k < chars.length; k++) {
    const a = chars[k];
    const t = model.delta[s] ? model.delta[s][a] : undefined;
    if (t === undefined) return { accepted: false, trace, stuck: { state: s, pos: k, sym: a } };
    s = t;
    trace.push({ state: s, pos: k + 1, sym: a });
  }
  return { accepted: model.finals.has(s), trace };
}

function sameLanguage(A, B, alpha) {
  const step = (M, s, a) => (s === '#' ? '#' : (M.delta[s] && M.delta[s][a] !== undefined ? M.delta[s][a] : '#'));
  const acc = (M, s) => s !== '#' && M.finals.has(s);
  const seen = new Set([A.init + '|' + B.init]);
  const q = [[A.init, B.init]];
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    if (acc(A, x) !== acc(B, y)) return false;
    for (const a of alpha) {
      const nx = step(A, x, a), ny = step(B, y, a);
      const k = nx + '|' + ny;
      if (!seen.has(k)) { seen.add(k); q.push([nx, ny]); }
    }
  }
  return true;
}

function minimize(dfa) {
  const errors = validate(dfa);
  const res = { errors };
  if (errors.length) return res;

  const m = runModelOf(dfa);
  const alpha = [...new Set(dfa.trans.flatMap(t => t.syms))].sort();
  const ids = dfa.states.map(s => s.id);

  // 1. reachability (BFS from the initial state)
  const bfs = [m.init];
  const seenSet = new Set(bfs);
  for (let i = 0; i < bfs.length; i++) {
    for (const a of alpha) {
      const t = m.delta[bfs[i]][a];
      if (t !== undefined && !seenSet.has(t)) { seenSet.add(t); bfs.push(t); }
    }
  }
  const order = ids.filter(i => seenSet.has(i));

function layoutMin() {

  const ids = new Set(states.map(s => s.id));
  const trans = min.trans.filter(t => ids.has(t.from) && ids.has(t.to)).map(t => Object.assign({}, t));
  const layer = {}; const q = [];

  for (let i = 0; i < q.length; i++) trans.filter(t => t.from === q[i]).forEach(t => { if (layer[t.to] === undefined) { layer[t.to] = layer[q[i]] + 1; q.push(t.to); } });

  const tabs = [['reach', 'Unreachable states'], ['part', 'Partition refinement'], ['min', 'Minimized DFA']];
  let h = '<div class="summary"><div class="stat"><b>' + total + '</b><span>states drawn</span></div><span class="arrowsep" aria-hidden="true">→</span><div class="stat"><b>' + reach + '</b><span>reachable</span></div><span class="arrowsep" aria-hidden="true">→</span><div class="stat"><b>' + min + '</b><span>in the minimal DFA</span></div></div>' +
    '<div class="classes"><span>Equivalence classes:</span>' + r.classes.map(c => '<span class="chip cls">{' + c.map(label).map(esc).join(', ') + '}</span>').join('') + (r.unreachable.length ? '<span>Removed:</span>' + r.unreachable.map(s => '<span class="chip dim">' + esc(s) + '</span>').join('') : '') + '</div>' +
    '<div class="verify' + (r.verified ? '' : ' bad') + '">' + (r.verified ? '✓ Checked: the minimal DFA accepts exactly the same strings as your DFA.' : 'The language check failed.') + '</div>' +
    '<div><div class="tabs" role="tablist" aria-label="Minimization steps">' + tabs.map(t => '<button class="tab" role="tab" id="tab-' + t[0] + '" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '" tabindex="' + (tab === t[0] ? 0 : -1) + '">' + t[1] + '</button>').join('') + '</div>' +
    '<div class="panel" role="tabpanel" aria-labelledby="tab-' + tab + '">' + ({ reach: panelReach, part: panelPart, min: panelMin }[tab])() + '</div></div>';
  box.innerHTML = h;
  mn.svg = null;
  if (tab === 'min') {
    mn.svg = $('#mnSvg'); mn.slider = $('#mnSize'); mn.out = $('#mnSizeOut');
    mn.slider.addEventListener('input', e => setZoom(mn, e.target.value / 100));
    if (window.ResizeObserver) new ResizeObserver(() => applyView(mn)).observe(mn.svg);
    redrawMn(); fitView(mn, mnGraph.states);
    bindMn();
    $('#btnRunMin').addEventListener('click', () => startRun('min'));
  }
}
function bindMn() {
  let d = null;
  const svg = mn.svg;
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const p = toModel(svg, e), el = e.target.closest('[data-st]');
    if (el) { const s = mnGraph.states.find(x => x.id === el.dataset.st); mnSel = { type: 'state', id: s.id }; d = { k: 'st', s, dx: p.x - s.x, dy: p.y - s.y }; }
    else { mnSel = null; d = { k: 'pan', sx: e.clientX, sy: e.clientY, ox: mn.ox, oy: mn.oy }; }
    try { svg.setPointerCapture(e.pointerId); } catch (_) {} redrawMn();
  });
  svg.addEventListener('pointermove', e => {
    if (!d) return; const p = toModel(svg, e);
    if (d.k === 'st') { d.s.x = Math.round(p.x - d.dx); d.s.y = Math.round(p.y - d.dy); redrawMn(); }
    else { mn.ox = d.ox - (e.clientX - d.sx) / mn.z; mn.oy = d.oy - (e.clientY - d.sy) / mn.z; applyView(mn); }
  });
  svg.addEventListener('pointerup', () => { d = null; });
  svg.addEventListener('pointercancel', () => { d = null; });
}
$('#resBody').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; renderResults(); const nt = $('#tab-' + tab); if (nt) nt.focus(); return; }
});
$('#resBody').addEventListener('keydown', e => {
  const t = e.target.closest('[data-tab]'); if (!t || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  const ids = [...document.querySelectorAll('[data-tab]')].map(x => x.dataset.tab); const i = ids.indexOf(tab);
  tab = ids[(i + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]; renderResults(); $('#tab-' + tab).focus();
});

/* ---------- boot ---------- */
setTool('select');
loadExample('seven');
</script>
